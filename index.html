<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>유한양행 DART 재무 대시보드</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231769aa'/%3E%3Cpath d='M8 9h4l4 8 4-8h4l-6 14h-4z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#13253c;--muted:#607086;--line:#dae3ec;--blue:#1269aa;--sky:#c7e4f5;--bg:#f4f8fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif}.wrap{max-width:1120px;margin:auto;padding:42px 20px 64px}header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}h1{margin:0;font-size:30px;letter-spacing:-.04em}h2{margin:0 0 15px;font-size:17px}p{line-height:1.6;color:var(--muted)}a{color:var(--blue)}.small{font-size:13px;text-align:right}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card,section{background:#fff;border:1px solid var(--line);border-radius:13px}.card{padding:18px}.label{font-size:13px;color:var(--muted)}.value{font-size:25px;font-weight:750;letter-spacing:-.04em;margin:8px 0}.sub{font-size:13px;color:#16764d}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}section{padding:22px;margin-top:18px}.bars{height:218px;display:flex;align-items:end;gap:18px;border-bottom:1px solid var(--line);padding:6px 4px 27px}.group{height:100%;flex:1;display:flex;align-items:end;justify-content:center;gap:5px;position:relative}.bar{width:35%;min-height:2px;border-radius:4px 4px 0 0}.revenue{background:var(--sky)}.profit{background:var(--blue)}.year{position:absolute;bottom:-23px;font-size:12px;color:var(--muted)}.legend{font-size:12px;color:var(--muted);margin-top:13px;display:flex;gap:15px}.dot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:5px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{color:var(--muted);font-weight:600}.error{color:#a94b00}@media(max-width:760px){.wrap{padding:30px 15px}header,.layout{display:block}.small{text-align:left}.grid{grid-template-columns:repeat(2,1fr)}.value{font-size:21px}section{overflow:auto}}
  </style>
</head>
<body><main class="wrap"><header><div><h1>유한양행 재무 대시보드</h1><p id="subtitle">OpenDART 데이터 로딩 중</p></div><p class="small"><a id="report" target="_blank" rel="noreferrer">DART 기업보고서</a><br><span id="updated"></span></p></header><div class="grid" id="cards"></div><div class="layout"><section><h2>연간 매출과 영업이익</h2><div class="bars" id="bars"></div><div class="legend"><span><i class="dot revenue"></i>매출액</span><span><i class="dot profit"></i>영업이익</span></div></section><section><h2>최근 연간 재무비율</h2><table id="ratio-table"><tbody></tbody></table><p class="small">ROA·ROE·DSO는 평균 잔액 기준</p></section></div><section><h2>주요 재무 데이터</h2><table id="financial-table"><thead><tr><th>항목</th></tr></thead><tbody></tbody></table></section><section><h2>해석 유의사항</h2><p>순이익, ROA, ROE는 처분이익 등 비경상 항목의 영향을 받을 수 있습니다. 영업이익률, CFO 전환율, 매출채권 및 재고자산의 변화를 함께 확인하세요. 이 대시보드는 투자 권유가 아닙니다.</p></section></main>
<script>
const won=n=>n==null?'—':`${(n/1e8).toLocaleString('ko-KR',{maximumFractionDigits:0})}억원`, pct=n=>n==null?'—':`${n.toFixed(1)}%`;
fetch('data/dashboard.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{const fs=d.annual_financials,rs=d.annual_ratios,current=fs.at(-1),ratio=rs.at(-1),previous=rs.at(-2);document.querySelector('#subtitle').textContent=d.basis;document.querySelector('#report').href=d.source.report_url;document.querySelector('#updated').textContent=`갱신 ${new Date(d.updated_at).toLocaleString('ko-KR')}`;const cards=[['매출액',won(current.revenue),`전년 대비 ${pct(ratio.revenue_growth_pct)}`],['영업이익률',pct(ratio.operating_margin_pct),`전년 ${pct(previous?.operating_margin_pct)}`],['당기순이익',won(current.net_income),`순이익률 ${pct(ratio.net_margin_pct)}`],['영업현금흐름',won(current.operating_cash_flow),`CFO 전환율 ${pct(ratio.cfo_conversion_pct)}`]];document.querySelector('#cards').innerHTML=cards.map(c=>`<article class="card"><div class="label">${c[0]}</div><div class="value">${c[1]}</div><div class="sub">${c[2]}</div></article>`).join('');const max=Math.max(...fs.map(x=>x.revenue));document.querySelector('#bars').innerHTML=fs.map(x=>`<div class="group"><i class="bar revenue" style="height:${x.revenue/max*100}%"></i><i class="bar profit" style="height:${x.operating_income/max*100}%"></i><span class="year">${x.year}</span></div>`).join('');document.querySelector('#ratio-table tbody').innerHTML=[['영업이익률',pct(ratio.operating_margin_pct)],['순이익률',pct(ratio.net_margin_pct)],['ROA',pct(ratio.roa_pct)],['ROE',pct(ratio.roe_pct)],['유동비율',pct(ratio.current_ratio_pct)],['부채비율',pct(ratio.debt_to_equity_pct)],['DSO',ratio.dso_days==null?'—':`${ratio.dso_days.toFixed(1)}일`]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('');const head=document.querySelector('#financial-table thead tr');fs.forEach(x=>head.insertAdjacentHTML('beforeend',`<th>${x.year}</th>`));document.querySelector('#financial-table tbody').innerHTML=[['매출액','revenue'],['영업이익','operating_income'],['당기순이익','net_income'],['영업활동현금흐름','operating_cash_flow'],['자산총계','total_assets'],['부채총계','total_liabilities'],['자본총계','total_equity']].map(x=>`<tr><td>${x[0]}</td>${fs.map(y=>`<td>${won(y[x[1]])}</td>`).join('')}</tr>`).join('')}).catch(()=>{document.querySelector('#subtitle').innerHTML='<span class="error">데이터가 없습니다. README의 API 키 설정 후 GitHub Actions를 수동 실행하세요.</span>'});
</script></body></html>
