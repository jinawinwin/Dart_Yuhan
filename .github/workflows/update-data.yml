name: Update OpenDART financial data

on:
  workflow_dispatch:
  schedule:
    # 매월 1일 09:30 KST (00:30 UTC). GitHub Actions 스케줄은 몇 분 지연될 수 있습니다.
    - cron: "30 0 1 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and analyse disclosures
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python scripts/fetch_opendart.py --start-year 2020
          python scripts/analyze.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "chore: update OpenDART data"
          git push
